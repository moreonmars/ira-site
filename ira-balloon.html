<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ira Performance — Material Study</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #050505;
    height: 100%;
}

canvas {
    display: block;
}
</style>

</head>

<body>

<script type="module">

import * as THREE from 
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


let scene, camera, renderer;
let balloon;
let points = [];
let mouse = new THREE.Vector2();
let target = new THREE.Vector3();


init();
animate();


function init(){

    scene = new THREE.Scene();


    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    camera.position.z = 5;


    renderer = new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        window.devicePixelRatio
    );

    document.body.appendChild(renderer.domElement);



    const geometry = new THREE.SphereGeometry(
        1.5,
        128,
        128
    );


    const material = new THREE.MeshPhysicalMaterial({

        color:0xffffff,

        transparent:true,

        opacity:0.38,

        roughness:0.05,

        metalness:0,

        transmission:0.8,

        thickness:1.5,

        clearcoat:1,

        clearcoatRoughness:0.1

    });



    balloon = new THREE.Mesh(
        geometry,
        material
    );

    scene.add(balloon);



    geometry.attributes.position.array.forEach(()=>{});


    const position =
    geometry.attributes.position;


    for(
        let i=0;
        i<position.count;
        i++
    ){

        points.push({

            original:
            new THREE.Vector3(
                position.getX(i),
                position.getY(i),
                position.getZ(i)
            ),

            velocity:
            new THREE.Vector3()

        });

    }



    const light = new THREE.PointLight(
        0xffffff,
        5
    );

    light.position.set(
        2,
        3,
        4
    );

    scene.add(light);


    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            1
        )
    );


    window.addEventListener(
        "pointermove",
        e=>{

            mouse.x =
            (e.clientX/window.innerWidth)*2-1;

            mouse.y =
            -(e.clientY/window.innerHeight)*2+1;


            const ray =
            new THREE.Raycaster();

            ray.setFromCamera(
                mouse,
                camera
            );


            const hit =
            new THREE.Vector3();


            ray.ray.at(
                3,
                hit
            );

            target.copy(hit);

        }
    );


    window.addEventListener(
        "resize",
        resize
    );

}



function updateBalloon(){


    const pos =
    balloon.geometry.attributes.position;


    for(
        let i=0;
        i<points.length;
        i++
    ){

        let p = points[i];


        let current =
        new THREE.Vector3(
            pos.getX(i),
            pos.getY(i),
            pos.getZ(i)
        );


        let force =
        new THREE.Vector3()
        .subVectors(
            p.original,
            current
        )
        .multiplyScalar(
            0.04
        );


        p.velocity.add(force);


        let world =
        current.clone();


        let distance =
        world.distanceTo(target);


        if(distance < 1.2){

            let push =
            world.clone()
            .sub(target)
            .normalize()
            .multiplyScalar(
                (1.2-distance)*0.15
            );


            p.velocity.add(push);

        }


        p.velocity.multiplyScalar(
            0.92
        );


        current.add(
            p.velocity
        );


        pos.setXYZ(
            i,
            current.x,
            current.y,
            current.z
        );

    }


    pos.needsUpdate=true;

    balloon.geometry.computeVertexNormals();

}



function animate(){

    requestAnimationFrame(
        animate
    );


    updateBalloon();


    balloon.rotation.y +=0.002;


    renderer.render(
        scene,
        camera
    );

}



function resize(){

    camera.aspect =
    window.innerWidth /
    window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


</script>

</body>
</html>
